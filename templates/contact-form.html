<form id="contact-form" action="https://formspree.io/f/xblwgnop" method="POST" aria-describedby="privacy-note">
<div class="form-row"><div class="form-group"><label for="name">Votre nom <span>(obligatoire)</span></label><input id="name" name="nom" type="text" autocomplete="name" maxlength="120" required></div><div class="form-group"><label for="email">Votre email <span>(obligatoire)</span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div></div>
{{CHAMPS_PROJET}}
<div class="form-row"><div class="form-group"><label for="date">Date <span>(facultatif)</span></label><input id="date" name="date" type="date"></div><div class="form-group"><label for="location">Lieu <span>(facultatif)</span></label><input id="location" name="lieu" type="text" maxlength="200" placeholder="Ville ou lieu"></div></div>
<div class="form-group"><label for="message">Votre message <span>(obligatoire)</span></label><textarea id="message" name="message" rows="6" maxlength="10000" required placeholder="{{EXEMPLE_MESSAGE}}"></textarea></div>
<div class="honeypot" aria-hidden="true"><label for="website">Laisser ce champ vide</label><input id="website" name="_gotcha" type="text" tabindex="-1" autocomplete="off"></div>
<p id="privacy-note" class="form-note">Votre message me parvient via Formspree et ne sert qu’à vous répondre. <a href="{{RACINE}}mentions.html#confidentialite">En savoir plus sur l’utilisation de vos données et vos droits.</a></p>
<button type="submit" class="button">Envoyer</button><p id="form-status" class="form-status" role="status" aria-live="polite" tabindex="-1"></p>
</form>
