<main id="contenu">
  <header class="concert-opening" data-theatre>
    <figure class="concert-cover">
      {{CONCERT_HERO}}
    </figure>
    <div class="concert-curtain" aria-hidden="true"><canvas></canvas></div>
    <div class="concert-hero-copy">
      <h1>Photographe de concert<em>à Toulouse et Castres</em></h1>
      <span class="concert-hero-rule" aria-hidden="true"></span>
      <div class="concert-hero-actions"><a class="concert-hero-cta" href="contact.html">Demander un devis</a></div>
    </div>
    <button class="theatre-replay" type="button" hidden>Rejouer le lever de rideau</button>
  </header>
  <section id="reportages" class="concert-programme frame" aria-labelledby="programme-title">
    <div class="concert-section-heading"><h2 id="programme-title">Les reportages</h2><p class="concert-section-meta">{{CONCERT_SUMMARY}}</p></div>
    <div class="collection-grid concert-reportages">{{CONCERT_REPORTAGES}}</div>
  </section>
  {{CONCERT_EXTRACTS}}
  {{PRESENTATION}}
</main>
