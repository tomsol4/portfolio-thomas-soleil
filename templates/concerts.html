<main id="contenu">
  <header class="concert-opening" data-theatre>
    <figure class="concert-cover">
      {{CONCERT_HERO}}
    </figure>
    <p class="concert-cover-caption">{{CONCERT_HERO_CAPTION}}</p>
    <div class="theatre-scenery" aria-hidden="true">
      <div class="theatre-curtain theatre-curtain--left"></div><div class="theatre-curtain theatre-curtain--right"></div>
    </div>
    <div class="theatre-entry" hidden>
      <div class="theatre-intro">
        <p class="kicker">Photographies de concert</p>
        <p class="theatre-entry-title" role="heading" aria-level="1">En scène.</p>
      </div>
      <button class="theatre-enter" type="button">Passer l’ouverture <svg class="nav-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 6l7 6-7 6M13 6l7 6-7 6"/></svg></button>
    </div>
    <div class="concert-stage-content">
    <div class="concert-title-row">
      <p class="kicker">Photographies de concert</p>
      <h1>En scène.</h1>
      <p class="concert-opening-line">Chœurs et orchestres, à Toulouse et Castres.</p>
    </div>
    <div class="concert-opening-actions">
      <a class="concert-scroll" href="#reportages"><span class="concert-scroll-label">Découvrir les reportages</span><span class="concert-scroll-stub" aria-hidden="true">↓</span></a>
      <button class="theatre-replay" type="button" aria-label="Rejouer le lever de rideau" hidden><svg class="nav-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5v5h5M4.6 10A8 8 0 1 1 4 13.5"/></svg><span class="theatre-replay-label">Rejouer l’ouverture</span></button>
    </div>
    </div>
  </header>
  <section id="reportages" class="concert-programme frame" aria-labelledby="programme-title">
    <div class="concert-section-heading"><h2 id="programme-title">Les reportages</h2><p class="concert-section-meta">{{CONCERT_SUMMARY}}</p></div>
    <div class="collection-grid concert-reportages">{{CONCERT_REPORTAGES}}</div>
  </section>
  {{CONCERT_EXTRACTS}}
  {{PRESENTATION}}
</main>
